name: sync-engines
on:
  schedule:
    - cron: "0 9 * * *"   # 每日 UTC 09:00,晚于三引擎各自的刷新时间
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Bump engine submodules to latest
        run: |
          git submodule update --remote --recursive
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: sync engine snapshots"
          git push
